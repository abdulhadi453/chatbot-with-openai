services:
  - type: web
    name: chatbot-with-openai
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: chatbot-backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: APP_NAME
        value: Chatbot Backend
      - key: APP_VERSION
        value: 1.0.0
